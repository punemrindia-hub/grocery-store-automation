services:
  - type: web
    name: grocery-commerce-api
    runtime: node
    buildCommand: npm ci && npm run build --workspace @grocery/shared && npm run db:generate && npm run db:deploy --workspace @grocery/database && npm run build --workspace @grocery/api
    startCommand: npm run start --workspace @grocery/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

  - type: web
    name: grocery-commerce-dashboard
    runtime: static
    buildCommand: npm ci && npm run build --workspace @grocery/dashboard
    staticPublishPath: apps/dashboard/dist
    envVars:
      - key: VITE_API_URL
        sync: false